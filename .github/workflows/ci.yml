name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_call:
    # workflow_dispatch is the escape hatch for the changesets
    # auto-release flow — changesets/action's GITHUB_TOKEN-authored
    # PR doesn't trip ci.yml's pull_request: trigger (GitHub's
    # anti-loop guard suppresses workflow chains from GITHUB_TOKEN),
    # so changesets.yml `gh workflow run`s us against the PR ref to
    # land the required status checks on the PR head. See
    # changesets.yml's "Dispatch CI for Release PR" step.
    workflow_dispatch:

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1

jobs:
    test:
        name: cargo test (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest]
        steps:
            - uses: actions/checkout@v6

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2

            # Dioxus desktop needs WebKit on Linux for its webview backend.
            - name: Install Linux deps
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      libwebkit2gtk-4.1-dev \
                      libgtk-3-dev \
                      libsoup-3.0-dev \
                      libjavascriptcoregtk-4.1-dev \
                      libxdo-dev

            - name: cargo fmt
              run: cargo fmt --all -- --check

            - name: cargo clippy
              run: cargo clippy --workspace --tests -- -D warnings

            - name: cargo test
              run: cargo test --workspace --no-fail-fast

    # Build the macOS .app and verify it survives the first 10 seconds
    # after launch. Catches the entire class of "compiles + tests pass
    # but crashes on first render" bugs that pure-unit tests miss —
    # AppKit FFI panics, missing dylibs at runtime, bad codesign,
    # Dioxus context-provider ordering, etc. v1.5.0 shipped a Rust
    # panic that aborted before the first frame; this job would have
    # caught it at PR time. See pearl th-78d25c.
    #
    # GitHub's macos-latest runners have a full Aqua session — apps
    # can create NSWindows even without a logged-in user. The app
    # never becomes visible to anyone, we just check the process
    # is still alive after the first-render window has elapsed.
    smoke-launch:
        name: Smoke — bundle + launch .app
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v6

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2
              with:
                  # Distinct key from the cargo test job — release vs
                  # dev profile would otherwise thrash the cache.
                  shared-key: smoke-launch-release

            - name: Bundle Smooblue.app
              run: ./scripts/bundle-macos.sh

            - name: Launch and verify alive after 10s
              run: |
                  set +e
                  BIN="dist/Smooblue.app/Contents/MacOS/Smooblue"
                  if [[ ! -x "$BIN" ]]; then
                      echo "::error::bundle didn't produce $BIN"
                      exit 1
                  fi

                  # Launch detached; capture stdout+stderr for diag.
                  # SMOOBLUE_DEMO=1 → no network, deterministic first render.
                  SMOOBLUE_DEMO=1 RUST_BACKTRACE=full \
                      "$BIN" > /tmp/smooblue.out 2>&1 &
                  PID=$!
                  echo "▸ launched PID $PID"

                  # 10s is enough for the first render on a clean runner
                  # (typical: 2-4s). v1.5.0 aborted in <1s, so any pre-
                  # first-frame Rust panic / AppKit exception is caught.
                  sleep 10

                  if ! kill -0 "$PID" 2>/dev/null; then
                      echo "::error::Smooblue exited within 10s of launch"
                      echo "--- combined output ---"
                      cat /tmp/smooblue.out || true
                      exit 1
                  fi

                  echo "✓ Smooblue still alive after 10s — launch succeeded"

                  # Clean up. SIGTERM first, then SIGKILL after a beat
                  # in case the app installs a handler that takes a
                  # moment to drain.
                  kill -TERM "$PID" 2>/dev/null || true
                  sleep 2
                  kill -KILL "$PID" 2>/dev/null || true

                  exit 0

    # Linux counterpart of the macOS smoke-launch above. Builds the
    # release binary (same one cargo-deb packages into the .deb) and
    # boots it under Xvfb so WebKit-GTK can create its windows
    # headlessly. Catches the class of bug that bit pearl
    # th-bce4fb's pipeline: a dep cfg'd to macOS-only that crashes
    # the Linux compile (parking_lot in inbox.rs). `cargo test
    # (ubuntu-latest)` DID catch it but the Release PR's CI summary
    # made the failure easy to miss — having a dedicated smoke job
    # makes the regression louder + ALSO covers runtime issues that
    # `cargo test` wouldn't (missing dylibs in the .deb's depends,
    # wrong feature flags producing a broken binary, etc).
    smoke-launch-linux:
        name: Smoke — build + launch Linux binary
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: smoke-launch-linux-release

            # Runtime + dev libs the binary links against. The same
            # set the cargo-deb manifest declares as the .deb's
            # `depends` (libwebkit2gtk-4.1-0 etc) — installing the
            # -dev variants here also covers compile-time linkage.
            # xvfb gives us a virtual display so the GTK window can
            # come up without a real X11 session.
            - name: Install Linux deps + xvfb
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                      libwebkit2gtk-4.1-dev \
                      libgtk-3-dev \
                      libsoup-3.0-dev \
                      libjavascriptcoregtk-4.1-dev \
                      libayatana-appindicator3-dev \
                      librsvg2-dev \
                      libxdo-dev \
                      xvfb

            - name: Build release binary
              run: cargo build --release -p smooblue-app

            - name: Launch under Xvfb and verify alive after 10s
              run: |
                  set +e
                  BIN="target/release/smooblue-app"
                  if [[ ! -x "$BIN" ]]; then
                      echo "::error::cargo build didn't produce $BIN"
                      exit 1
                  fi

                  # xvfb-run sets up a virtual X display before
                  # invoking the binary. -a auto-picks a free
                  # display number; --server-args silences server
                  # stderr that would otherwise drown the app log.
                  SMOOBLUE_DEMO=1 RUST_BACKTRACE=full \
                      xvfb-run -a --server-args="-screen 0 1280x800x24" \
                      "$BIN" > /tmp/smooblue.out 2>&1 &
                  PID=$!
                  echo "▸ launched PID $PID"

                  # WebKit-GTK init on a cold runner is slower than
                  # AppKit; give it 15s rather than the macOS 10s.
                  sleep 15

                  # `kill -0` on the xvfb-run wrapper checks the
                  # wrapper, not the app. Look for the actual
                  # binary in the process tree.
                  if ! pgrep -f "target/release/smooblue-app" > /dev/null; then
                      echo "::error::Smooblue exited within 15s of launch"
                      echo "--- combined output ---"
                      cat /tmp/smooblue.out || true
                      exit 1
                  fi

                  echo "✓ Smooblue still alive after 15s on Linux"

                  pkill -TERM -f "target/release/smooblue-app" 2>/dev/null || true
                  sleep 2
                  pkill -KILL -f "target/release/smooblue-app" 2>/dev/null || true

                  exit 0

    # Real Bluesky integration tests — runs nightly, not on every PR, so
    # api.bsky.app rate-limits don't gate development.
    real-bluesky:
        name: Real Bluesky API tests
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - name: Install Linux deps
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
                      libjavascriptcoregtk-4.1-dev libxdo-dev
            - name: Run real-Bluesky tests
              run: cargo test --workspace -- --ignored --test-threads=1
